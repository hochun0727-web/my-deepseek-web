<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 多模型平台 (DeepSeek & Kimi)</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; background-color: #f4f6f8; color: #333; }
        header { background: #1a252f; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        header h2 { margin: 0; font-size: 1.2rem; }
        select { padding: 8px; border-radius: 5px; font-size: 1rem; border: none; outline: none; cursor: pointer; background: #ecf0f1; }
        
        .main-container { display: flex; flex: 1; overflow: hidden; flex-direction: row; }
        
        .sidebar { width: 280px; background: white; padding: 20px; border-right: 1px solid #e0e0e0; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .sidebar h3 { margin-top: 0; border-bottom: 2px solid #f4f6f8; padding-bottom: 10px; }
        .warning-text { font-size: 0.85rem; color: #d32f2f; background: #ffebee; padding: 10px; border-radius: 5px; margin: 0; }
        .settings-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem;}
        .settings-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        .btn-save { background: #16a085; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-save:hover { background: #12876f; }

        .chat-area { flex: 1; display: flex; flex-direction: column; padding: 20px; background: #fff; }
        .messages-container { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px; border: 1px solid #eee; border-radius: 8px; background: #fafafa; }
        
        .msg-bubble { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 1rem; word-wrap: break-word; }
        .msg-user { background: #2980b9; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-bot { background: #e9ecef; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #ddd; }
        .preview-img { max-width: 200px; border-radius: 8px; margin-top: 10px; display: block; border: 1px solid #ccc; }
        
        .input-box { display: flex; gap: 10px; align-items: center; }
        .file-upload-label { cursor: pointer; padding: 10px 15px; background: #ecf0f1; border-radius: 5px; border: 1px solid #ccc; font-size: 1.2rem; transition: 0.2s; display: inline-block; }
        .file-upload-label:hover { background: #bdc3c7; }
        input[type="file"] { display: none; }
        .input-box input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; outline: none; transition: 0.2s; }
        .input-box input[type="text"]:focus { border-color: #2980b9; }
        .btn-send { padding: 0 25px; background: #1a252f; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.3s; }
        .btn-send:hover { background: #2c3e50; }
        .btn-send:disabled { background: #95a5a6; cursor: not-allowed; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: auto; border-right: none; border-bottom: 1px solid #e0e0e0; max-height: 250px; }
        }
    </style>
</head>
<body>

    <header>
        <h2>🧠 AI 聚合平台 (DeepSeek & Kimi)</h2>
        <div>
            <select id="model-select" onchange="handleModelChange()">
                <optgroup label="DeepSeek (純文字模型)">
                    <option value="deepseek-chat">DeepSeek Chat (V3)</option>
                    <option value="deepseek-reasoner">DeepSeek Reasoner (R1)</option>
                </optgroup>
                <optgroup label="月之暗面 Kimi (支援圖片)">
                    <option value="moonshot-v1-8k-vision">Kimi Vision (8k)</option>
                </optgroup>
            </select>
        </div>
    </header>

    <div class="main-container">
        <!-- 左側設定 -->
        <aside class="sidebar">
            <h3>⚙️ 系統設定</h3>
            <p class="warning-text">密鑰將安全儲存於本機瀏覽器中。</p>
            
            <div class="settings-group">
                <label>DeepSeek API Key</label>
                <input type="password" id="ds-api-key" placeholder="sk-...">
            </div>
            
            <div class="settings-group">
                <label>Kimi API Key</label>
                <input type="password" id="kimi-api-key" placeholder="sk-...">
            </div>
            
            <button class="btn-save" onclick="saveKeys()">💾 儲存並套用</button>
        </aside>

        <!-- 右側對話 -->
        <main class="chat-area">
            <div class="messages-container" id="chat-box">
                <div class="msg-bubble msg-bot">歡迎！<br><br>1. 若要進行深度文字推理，請選擇 <b>DeepSeek</b> 模型。<br>2. 若要分析圖片，請切換至 <b>Kimi Vision</b> 模型，下方即會出現上載按鈕。<br><br>請確保左側已填寫對應的 API Key。</div>
            </div>
            
            <!-- 圖片預覽區 -->
            <div id="image-preview-container" style="display: none; margin-bottom: 10px;">
                <span style="font-size: 0.9rem; font-weight: bold; color: #2980b9;">📎 待發送圖片：</span>
                <img id="image-preview" class="preview-img" src="" alt="預覽">
            </div>

            <div class="input-box">
                <!-- 圖片上載按鈕 (預設隱藏，切換視覺模型時顯示) -->
                <label class="file-upload-label" id="upload-label" for="image-upload" title="上載圖片" style="display: none;">📎</label>
                <input type="file" id="image-upload" accept="image/*" onchange="previewImage(event)">
                
                <input type="text" id="user-input" placeholder="輸入訊息..." onkeypress="handleEnter(event)">
                <button class="btn-send" id="send-btn" onclick="sendMessage()">送出</button>
            </div>
        </main>
    </div>

    <script>
        let currentImageURL = null;

        // 網頁載入時自動讀取 API Keys 並檢查模型選單狀態
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('ds-api-key').value = localStorage.getItem('ds_api_key') || '';
            document.getElementById('kimi-api-key').value = localStorage.getItem('kimi_api_key') || '';
            handleModelChange(); 
        });

        // 切換模型時的動態介面處理
        function handleModelChange() {
            const model = document.getElementById('model-select').value;
            const uploadLabel = document.getElementById('upload-label');
            const imageUpload = document.getElementById('image-upload');
            const previewContainer = document.getElementById('image-preview-container');

            if (model.includes('deepseek')) {
                // 純文字模型：隱藏並清空圖片上載功能
                uploadLabel.style.display = 'none';
                currentImageURL = null;
                previewContainer.style.display = 'none';
                imageUpload.value = '';
                document.getElementById('user-input').placeholder = "輸入訊息 (DeepSeek 不支援圖片)...";
            } else {
                // 視覺模型：顯示圖片上載功能
                uploadLabel.style.display = 'inline-block';
                document.getElementById('user-input').placeholder = "輸入訊息或針對圖片提問...";
            }
        }

        // 儲存密鑰至瀏覽器
        function saveKeys() {
            localStorage.setItem('ds_api_key', document.getElementById('ds-api-key').value.trim());
            localStorage.setItem('kimi_api_key', document.getElementById('kimi-api-key').value.trim());
            alert('✅ 密鑰設定已成功儲存！');
        }

        function handleEnter(event) {
            if (event.key === 'Enter') sendMessage();
        }

        // 處理圖片預覽
        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentImageURL = e.target.result;
                document.getElementById('image-preview').src = currentImageURL;
                document.getElementById('image-preview-container').style.display = 'block';
            };
            reader.readAsDataURL(file);
        }

        // 顯示訊息對話泡泡
        function appendMessage(text, type, imgSrc = null) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `msg-bubble ${type === 'user' ? 'msg-user' : 'msg-bot'}`;
            
            let content = text ? text.replace(/\n/g, '<br>') : '';
            if (imgSrc) {
                content += (content ? '<br><br>' : '') + `<img src="${imgSrc}" class="preview-img">`;
            }
            
            div.innerHTML = content || '(無文字內容)';
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 發送 API 請求的核心邏輯
        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            const model = document.getElementById('model-select').value;
            const sendBtn = document.getElementById('send-btn');
            
            if (!message && !currentImageURL) return;

            let apiKey = '';
            let apiUrl = '';
            let requestBody = { model: model, messages: [] };

            if (model.includes('deepseek')) {
                apiKey = localStorage.getItem('ds_api_key');
                apiUrl = 'https://api.deepseek.com/chat/completions';
                // DeepSeek 純文字格式
                requestBody.messages.push({ role: 'user', content: message });
            } else if (model.includes('moonshot')) {
                apiKey = localStorage.getItem('kimi_api_key');
                apiUrl = 'https://api.moonshot.cn/v1/chat/completions';
                // Kimi 視覺圖文格式
                let messageContent = [];
                if (message) messageContent.push({ type: "text", text: message });
                if (currentImageURL) messageContent.push({ type: "image_url", image_url: { url: currentImageURL } });
                requestBody.messages.push({ role: 'user', content: messageContent });
            }

            if (!apiKey) {
                alert(`請先在左側設定並儲存對應的 API Key！`);
                return;
            }

            // 畫面顯示輸入內容
            appendMessage(message, 'user', currentImageURL);
            
            // 清空輸入框與預覽狀態
            inputField.value = '';
            document.getElementById('image-upload').value = '';
            document.getElementById('image-preview-container').style.display = 'none';
            const tempImageBackup = currentImageURL;
            currentImageURL = null; 
            
            sendBtn.disabled = true;
            sendBtn.innerText = '處理中...';

            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);
                appendMessage(data.choices[0].message.content, 'bot');

            } catch (error) {
                appendMessage(`❌ 發生錯誤：${error.message}`, 'bot');
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = '送出';
                inputField.focus();
            }
        }
    </script>
</body>
</html>
