<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek 私人助理</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; background-color: #f4f6f8; color: #333; }
        header { background: #003366; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        header h2 { margin: 0; font-size: 1.2rem; }
        select { padding: 8px; border-radius: 5px; font-size: 1rem; border: none; outline: none; cursor: pointer; }
        
        .main-container { display: flex; flex: 1; overflow: hidden; flex-direction: row; }
        
        /* 左側設定區塊 */
        .sidebar { width: 280px; background: white; padding: 20px; border-right: 1px solid #e0e0e0; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .sidebar h3 { margin-top: 0; border-bottom: 2px solid #f4f6f8; padding-bottom: 10px; }
        .warning-text { font-size: 0.85rem; color: #d32f2f; background: #ffebee; padding: 10px; border-radius: 5px; margin: 0; }
        .settings-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem;}
        .settings-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        .btn-save { background: #16a085; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-save:hover { background: #12876f; }

        /* 右側對話區塊 */
        .chat-area { flex: 1; display: flex; flex-direction: column; padding: 20px; background: #fff; }
        .messages-container { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px; border: 1px solid #eee; border-radius: 8px; background: #fafafa; }
        
        .msg-bubble { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 1rem; word-wrap: break-word; }
        .msg-user { background: #003366; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-bot { background: #e9ecef; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #ddd; }
        
        /* 輸入區塊 */
        .input-box { display: flex; gap: 10px; }
        .input-box input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; outline: none; transition: 0.2s; }
        .input-box input:focus { border-color: #003366; }
        .btn-send { padding: 0 25px; background: #003366; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.3s; }
        .btn-send:hover { background: #002244; }
        .btn-send:disabled { background: #95a5a6; cursor: not-allowed; }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: auto; border-right: none; border-bottom: 1px solid #e0e0e0; max-height: 220px; }
        }
    </style>
</head>
<body>

    <header>
        <h2>🐋 DeepSeek 私人助理</h2>
        <div>
            <select id="model-select">
                <option value="deepseek-chat">DeepSeek Chat (V3)</option>
                <option value="deepseek-reasoner">DeepSeek Reasoner (R1)</option>
            </select>
        </div>
    </header>

    <div class="main-container">
        <!-- 左側設定 -->
        <aside class="sidebar">
            <h3>⚙️ 系統設定</h3>
            <p class="warning-text">密鑰</p>
            
            <div class="settings-group">
                <label>DeepSeek API Key</label>
                <input type="password" id="api-key" placeholder="sk-...">
            </div>
            
            <button class="btn-save" onclick="saveKey()">💾 儲存並套用</button>
        </aside>

        <!-- 右側對話 -->
        <main class="chat-area">
            <div class="messages-container" id="chat-box">
                <div class="msg-bubble msg-bot">Have are nice day </div>
            </div>
            
            <div class="input-box">
                <input type="text" id="user-input" placeholder="輸入訊息..." onkeypress="handleEnter(event)">
                <button class="btn-send" id="send-btn" onclick="sendMessage()">送出</button>
            </div>
        </main>
    </div>

    <script>
        // 初始化讀取密鑰
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('api-key').value = localStorage.getItem('ds_api_key') || '';
        });

        function saveKey() {
            const key = document.getElementById('api-key').value.trim();
            localStorage.setItem('ds_api_key', key);
            alert('✅SAVE');
        }

        function handleEnter(event) {
            if (event.key === 'Enter') sendMessage();
        }

        function appendMessage(text, type) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = `msg-bubble ${type === 'user' ? 'msg-user' : 'msg-bot'}`;
            div.innerHTML = text.replace(/\n/g, '<br>');
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            const model = document.getElementById('model-select').value;
            const sendBtn = document.getElementById('send-btn');
            const apiKey = localStorage.getItem('ds_api_key');
            
            if (!message) return;
            if (!apiKey) {
                alert('請先在左側輸入並儲存');
                return;
            }

            appendMessage(message, 'user');
            inputField.value = '';
            sendBtn.disabled = true;
            sendBtn.innerText = '思考中...';

            try {
                const response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: 'user', content: message }]
                    })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);
                appendMessage(data.choices[0].message.content, 'bot');

            } catch (error) {
                appendMessage(`❌ 發生錯誤：${error.message}`, 'bot');
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerText = '送出';
                inputField.focus();
            }
        }
    </script>
</body>
</html>
